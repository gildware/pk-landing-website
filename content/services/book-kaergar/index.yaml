faqs:
  - question: What is Book Kaergar?
    answer: Book Kaergar lets you hire a verified professional for a fixed time package — 1 hour, half day (about 4 hours), or full day (about 8 hours) — instead of only booking a single named job.
  - question: Are materials included?
    answer: No. Time packages cover professional labour. Materials, spare parts, and consumables are quoted separately if needed.
  - question: How do I book?
    answer: Call us, WhatsApp us, use the website booking form, or book in the Panun Kaergar app. Support details are also in the app profile and contact sections.
  - question: Which professionals can I book?
    answer: Home Trades (carpenter, electrician, plumber, painter), Building & Site (mason, labour, welder/fabricator), Home Care (gardener, cleaner), and Beauty Artists (makeup, mehndi).
