howItWorksTitle: Three steps. Then it’s done.
howItWorksSteps:
  - title: Tell us the job
    description: >-
      What broke, where you live, and when someone can visit. Phone, WhatsApp, website, or app —
      same process.
  - title: We plan the visit
    description: >-
      You get a price before work starts. We pick who goes — our crew or a specialist — and
      confirm the slot.
  - title: We finish it
    description: >-
      They arrive ready, do the work, and you pay as agreed. If it isn’t right, you call us.
whyChooseTitle: Built for real Kashmir homes
whyChooseItems:
  - title: Times that fit the house
    description: >-
      Morning, afternoon, or evening. Book around school runs, namaz, and winter daylight — not
      around a technician’s mood.
  - title: One number for the house
    description: >-
      Plumbing today, a salon visit next week, the geyser in January. You don’t collect new
      contacts for every trade.
  - title: Book again in seconds
    description: >-
      The app remembers the last job. Same leak next winter? Rebook without explaining the house
      from scratch.
  - title: Help after the visit
    description: >-
      A no-show or a job that didn’t hold? You don’t argue with a private number. Support sits
      with Panun Kaergar.
platformFeatures:
  - icon: 🏠
    title: No technician hunting
    description: >-
      Stop asking neighbours for numbers. One request covers the search, the schedule, and who
      shows up.
  - icon: 🎯
    title: Price before they start
    description: >-
      You see an estimate or a clear range first. Extra parts are explained before anyone buys
      them.
  - icon: ✅
    title: Checked people at the door
    description: >-
      Own teams and professional partners — onboarded before they take a Kashmir home visit.
  - icon: 💬
    title: Book how you like
    description: >-
      Call +91 8899 181 555, WhatsApp, the website form, or the free app. No app required.
  - icon: 📞
    title: We stay on the line
    description: >-
      Delay, complaint, or a revisit — you talk to our Srinagar team, not a stranger’s personal
      phone.
  - icon: ✔️
    title: The job is on us
    description: >-
      You hired Panun Kaergar. If the work fails, we own the follow-up.
