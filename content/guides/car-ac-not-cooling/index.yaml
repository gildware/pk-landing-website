heroSub: 'Cold air needs a clear path through the cabin and out of the condenser.'
scene: |-
  The blower is loud, the dashboard says AC, and everyone is still reaching for the window switch. Before blaming the refrigerant, give the system a fair, safe test.
quickAnswer: |-
  Run the AC with windows closed and recirculation on, then check whether the vents have strong airflow. A clogged cabin filter or a blocked condenser grille can make a healthy system feel weak. If air remains warm, cooling fades, there are oily marks, or the compressor makes unusual noise, book vehicle AC service for a leak and performance diagnosis — not a blind refill.
