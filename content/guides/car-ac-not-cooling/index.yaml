headline: 'Car AC not cooling? Check airflow before blaming the gas'
excerpt: |-
  Car AC blowing warm or weak air? Check recirculation, cabin-filter airflow and the condenser grille safely — then know when a leak diagnosis beats a blind gas refill.
seoTitle: 'Car AC not cooling? Checks before refill | Panun Kaergar'
seoDescription: |-
  Car AC not cooling? Check recirculation, airflow, and condenser clearance before paying for a gas refill or leak diagnosis.
category: 'Vehicle Care'
publishedAt: 2026-07-25
