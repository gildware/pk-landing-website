title: aluminium-door-not-sliding-smoothly
headline: 'Aluminium door not sliding smoothly? Clean the track before you force it'
excerpt: |-
  The balcony door in a flat needs a hip-check every evening. Vacuum and wipe the track, clear weep holes, check rollers and alignment, then use a dry silicone lubricant sparingly.
