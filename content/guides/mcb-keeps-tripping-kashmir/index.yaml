heroSub: 'That click is a warning — not a challenge.'
scene: |-
  On a cold winter morning, the heater, kettle and geyser all wake up before the family does. Then the kitchen goes dark and somebody says, “Just push that switch up again.”
quickAnswer: |-
  Unplug everything on the affected circuit, reset the MCB once, then reconnect appliances one at a time. If it trips with nothing plugged in, smells hot, sparks, or serves a wet area, stop and book an electrician. Never uprate or tape a breaker to keep power on.
