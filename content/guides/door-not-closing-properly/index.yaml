title: door-not-closing-properly
headline: 'How to fix a door that will not close properly'
excerpt: |-
  A rain-swollen bedroom door needs a shoulder nudge every night. Locate where it rubs, tighten hinge screws, and check latch alignment.
seoTitle: 'Door not closing properly? Find the rub | Panun Kaergar'
seoDescription: |-
  Door not closing properly? Find where it rubs before forcing the latch, and know when a carpenter should adjust hinges or the frame.
