headline: 'AC leaking water indoors? Check the drain before panicking'
excerpt: |-
  On a humid July afternoon, a split AC starts dripping from the indoor unit onto the floor. Switch off, check whether water is condensate or oily refrigerant, inspect the drain pipe and filter, and clear blockages gently.
