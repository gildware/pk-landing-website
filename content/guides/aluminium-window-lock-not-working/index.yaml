headline: 'Aluminium window lock not working? Check alignment before you force the key'
excerpt: |-
  On a windy evening the bedroom window rattles but the handle will not fully lock. Check whether the handle moves freely, inspect strike plate alignment, clean and lubricate the mechanism with a dry product, and tighten loose frame screws.
