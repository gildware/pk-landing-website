headline: 'One room has no power? Find the right breaker before blaming the whole house'
excerpt: |-
  The bedroom goes dark after a heater runs all evening, but the kitchen still hums. Check whether only one room is affected, reset the matching MCB once with loads unplugged, test a socket with a simple lamp or charger, and look for a tripped RCCB or loose switch plate.
