heroSub: 'Most bed squeaks are loose joints — strip the bedding and tighten before replacing the frame.'
scene: |-
  Every turn in bed sets off a dry wooden squeak, the side rail has a visible gap at the headboard, and someone wedges cardboard under a leg that no longer sits flat.
quickAnswer: |-
  Strip bedding, tighten visible bolts and corner brackets, check centre supports and slats, and stop rocking joints from working metal on wood. Cracked rails, stripped bolt holes, or a frame that still flexes after a careful tighten needs a carpenter.
