heroSub: 'Airflow is not the same as cooling.'
scene: |-
  The AC hums bravely while everyone shifts closer to the fan. The remote says 18°C; the room has other ideas.
quickAnswer: |-
  Set Cool mode, clean and fully dry the filters, close doors/windows, and give the outdoor unit clear airflow. If ice forms, switch cooling off and thaw. If air stays lukewarm after these checks, book appliance service — don’t demand a blind gas refill.
