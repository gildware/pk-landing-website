headline: 'Washing machine not draining? Check the filter before you call it dead'
excerpt: |-
  After a heavy winter wash, the machine stops mid-cycle with water sitting in the drum. Stop the cycle, unplug the machine, check the drain hose for kinks, clean the front filter or pump trap, and run a spin-only empty cycle.
