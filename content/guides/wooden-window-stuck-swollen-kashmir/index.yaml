heroSub: 'A stuck wooden window needs a rub diagnosis — forcing the handle usually costs a repair.'
scene: |-
  After a wet week the bedroom casement will not open more than a finger gap, someone leans on the handle until it feels ready to snap, and the room stays shut with stale air inside.
quickAnswer: |-
  Stop forcing the handle, find where the sash rubs, dry the area if damp, and ease only the marked high spot after the wood has dried. Loose hinges, a shifted frame, painted-shut edges, or a sash that still binds after careful easing needs a carpenter.
