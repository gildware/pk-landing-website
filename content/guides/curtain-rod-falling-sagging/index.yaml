headline: 'Curtain rod falling or sagging? Fix the anchor, not just the fabric'
excerpt: |-
  A heavy blackout curtain in a Sopore bedroom pulls the rod down with a soft crack on a windy night. Remove load, inspect brackets and fixings, move anchors to solid material if needed, and distribute weight across enough support points.
