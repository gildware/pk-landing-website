question: book-for-someone-else
questionText: Can I book a Panun Kaergar home service for a family member or another house in Kashmir?
answer: >-
  Yes. Book as usual by call, WhatsApp, website, or app, and clearly share the address where the
  work will happen plus a contact number for someone at that house. Mention that the job is for
  another household. We confirm the estimate and slot with you, and we coordinate the visit at
  the address you gave — not necessarily at your own home.
