question: become-partner
questionText: How do I join Panun Kaergar as a home-service partner in Kashmir?
answer: >-
  Apply on panunkaergar.com/become-a-partner or in the Panun Kaergar Partner app. There is no
  upfront listing fee. Our team reviews your details, onboards you on service standards and how
  jobs and payouts work, then activates you for relevant work. You fulfill jobs we assign; we
  bring the customer and manage the booking. Independent partners are not Panun Kaergar employees.
