question: how-to-book
questionText: How do I book a plumber, electrician, cleaner, or other home service with Panun Kaergar?
answer: >-
  Book in whichever way is easiest. Call +91 8899 181 555, WhatsApp the same number, fill the
  booking form on panunkaergar.com, or use the free Panun Kaergar customer app. Tell us the job,
  your area, and a preferred time. You do not need the app. After you request, we confirm the
  estimate, assign the professional, and keep the visit on track.
