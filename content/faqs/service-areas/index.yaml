questionText: Which areas in Kashmir does Panun Kaergar currently serve?
answer: >-
  Panun Kaergar serves homes across Kashmir’s ten districts: Srinagar, Budgam, Ganderbal,
  Bandipora, Baramulla, Kupwara, Anantnag, Kulgam, Pulwama, and Shopian. Coverage for a given
  service can vary by neighbourhood and time of day. Share your locality or full address when you
  book by call, WhatsApp, website, or app so we can confirm we can take the job at your home.
