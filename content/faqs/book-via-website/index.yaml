question: book-via-website
questionText: Can I book Panun Kaergar home services without downloading the app?
answer: >-
  Yes. The app is optional. Call +91 8899 181 555, WhatsApp us, or submit the form at
  panunkaergar.com/book-a-home-service. Give your name, phone, the service you need, your
  address, and a short description of the job. We confirm by call or WhatsApp. Use the app later
  if you want to track bookings, chat on a job, rebook, or earn loyalty points.
