question: refund-policy
questionText: When can I get a refund?
answer: >-
  Panun Kaergar manages your booking and payment end to end. If you cancel before the partner
  visits, amounts paid are refunded. If you cancel after the partner has visited, the booking
  confirmation amount is not refundable. If you paid the full amount in advance and the partner has
  only visited, the booking confirmation is deducted and the rest is refunded. If Panun Kaergar
  cancels before a visit and no suitable reschedule is possible, amounts paid are refunded in full.
  Refunds may also apply for verified poor workmanship, partner-caused damage, incomplete service,
  or duplicate charges. Pay only the company-approved amount through Panun Kaergar — amounts agreed
  or paid outside the official process are not covered. See our refund and cancellation policies for
  full details.
