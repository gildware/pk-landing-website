question: cancellation-policy
questionText: Can I cancel or reschedule a Panun Kaergar booking, and is there a cancellation fee?
answer: >-
  Yes. Use the Panun Kaergar app, or contact us by phone, WhatsApp, or email with your booking
  reference. Panun Kaergar manages your booking end to end — if you cancel before the partner
  visits, amounts paid are refunded. If you cancel after the partner has visited, the booking
  confirmation amount is not refundable. If you paid the full amount in advance and the partner has
  only visited, the booking confirmation is deducted and the rest is refunded. If Panun Kaergar
  cancels before a visit and no suitable reschedule is possible, amounts paid are refunded in full.
  See our cancellation and refund policies for full details.
