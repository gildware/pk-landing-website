questionText: How do I pay for a Panun Kaergar home service, and do I pay the person at the door?
answer: >-
  Payment is managed through Panun Kaergar — you are dealing with the company, not settling
  privately with whoever arrives. You can pay in the customer app with the online methods shown
  there, or pay as our team confirms after the job where cash or other options are available. The
  amount should match what we agreed, plus any extras that were explained before work continued.
