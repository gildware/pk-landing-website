question: payment-methods
questionText: How do I pay for a Panun Kaergar home service, and do I pay the person at the door?
answer: >-
  Pay only the amount confirmed by Panun Kaergar through our official app, website, phone, WhatsApp,
  or other designated channel. Payment is managed through Panun Kaergar — you are dealing with the
  company, not settling privately with whoever arrives. Use supported online methods in the app, or
  pay as confirmed by Panun Kaergar after the job where cash payment is available. Panun Kaergar sets
  and confirms the customer-facing price for each booking — you pay us for the agreed work, not a
  separate platform fee, and you do not negotiate or pay a separate amount directly to the partner.
  If additional work, scope changes, or extra materials are needed, contact Panun Kaergar before any
  extra amount is agreed or paid.
