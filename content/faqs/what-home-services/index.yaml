questionText: What home services can I book with Panun Kaergar in Kashmir?
answer: >-
  You can book everyday home help through one company: plumbing, electrician work, carpentry,
  masonry, painting, professional cleaning, dry cleaning and laundry, pest control, appliance
  repair, gardening, salon at home, aluminium and steel, pet grooming, vehicle care, and interior
  decor, depending on availability in your area. If your job is not listed, describe it when you
  book — we review custom requests and confirm whether we can take it, at what price, and when.
