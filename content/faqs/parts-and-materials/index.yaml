question: parts-and-materials
questionText: Who provides spare parts and materials for a Panun Kaergar repair or installation?
answer: >-
  It depends on the job. Some visits include basic materials; others need parts bought separately,
  such as a tap, wire, or appliance spare. Panun Kaergar confirms the customer-facing price for your
  booking, and any extra materials or scope changes should be reported to us before work continues
  so the applicable cost can be approved and communicated — there should be no surprise charges at
  the door. If you already have the part at home, mention that when you book.
