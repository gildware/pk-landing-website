question: partner-own-customers
questionText: Are Panun Kaergar service partners employees of the company?
answer: >-
  No. You join as an independent service partner, vendor, or specialist — not as an employee.
  Panun Kaergar owns the customer relationship and the operating process: pricing, booking,
  coordination, payment, and support. You fulfill assigned jobs to our standards under the
  agreed terms, using your own tools and skill.
