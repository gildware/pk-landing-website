questionText: What is Panun Kaergar?
answer: >-
  Panun Kaergar is Kashmir’s full-stack home-services company. You tell us what you need at home —
  we handle booking, pricing, coordination, payment, quality, and support. The work is done by our
  own teams and professional service partners. Book carpentry, plumbing, masonry, electrician,
  cleaning, pest control, laundry, painting, appliance repair, gardening, salon, and more by phone,
  WhatsApp, our website form, or the free customer app.
