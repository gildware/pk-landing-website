questionText: What is Panun Kaergar and how does it work for home services in Kashmir?
answer: >-
  Panun Kaergar is Kashmir’s home-services company, based in Srinagar. You book the company —
  not a private number. Tell us the job once by phone, WhatsApp, the website, or the app. We
  confirm the price, send the right professional, manage payment, and stay responsible until the
  work is done. You can book plumbing, electrical, carpentry, masonry, cleaning, pest control,
  laundry, painting, appliance repair, gardening, salon, and other home services across Kashmir.
