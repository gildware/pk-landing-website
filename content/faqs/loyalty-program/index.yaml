questionText: How do Panun Kaergar loyalty points work, and do I earn them if I book by phone?
answer: >-
  Loyalty points are earned when you complete a booking made in the Panun Kaergar customer app.
  They can be redeemed as wallet credit toward a later home service in the app. Bookings made
  only by call, WhatsApp, or the website form do not earn those points. You can still book
  without the app; points are an extra for app customers, not a requirement to get service.
