question: partner-earnings
questionText: How and when do Panun Kaergar partners get paid for completed jobs?
answer: >-
  Panun Kaergar collects payment from the customer and settles your agreed payout. Settlements
  currently run on daily and weekly cycles, and you can track them in the Partner app. Exact
  timing and deductions follow the commercial terms you accepted at onboarding. Customer-facing
  prices are set by Panun Kaergar, not by you at the house.
