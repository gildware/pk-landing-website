question: partner-earnings
questionText: How do Panun Kaergar partners get paid?
answer: >-
  Panun Kaergar manages the customer payment process and settles your agreed partner payout
  according to the applicable payment terms. Settlements currently run daily and weekly, and you
  can track them in the Partner app. Customer-facing prices are set by Panun Kaergar.
