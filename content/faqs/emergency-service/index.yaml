questionText: Does Panun Kaergar handle urgent or emergency home repairs in Kashmir?
answer: >-
  Yes, we treat urgent jobs as a priority and try to match the earliest available professional.
  Call or WhatsApp +91 8899 181 555, describe what happened (for example a burst pipe, no power
  in part of the house, or a dead geyser), and share your locality. We cannot promise an arrival
  time until we check capacity in your area, but we will tell you the soonest slot we can offer
  and keep you updated.
