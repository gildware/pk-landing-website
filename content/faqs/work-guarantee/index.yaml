question: work-guarantee
questionText: What if I am not happy with the work after a Panun Kaergar visit?
answer: >-
  Come back to Panun Kaergar. Call or WhatsApp +91 8899 181 555 with your booking details and
  what is wrong. We review the issue and work toward a fair next step, which may include a
  revisit or follow-up. You do not have to argue with a technician’s personal number. Refund
  eligibility depends on the service, whether the visit was completed as confirmed, and our
  refund policy on this website.
