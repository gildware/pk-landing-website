question: work-guarantee
questionText: What if I am not happy with the work after a Panun Kaergar visit?
answer: >-
  Come back to Panun Kaergar. Panun Kaergar owns the customer experience for every booking. We
  manage booking, pricing, coordination, payment, support, and complaint handling, while independent
  service partners perform the work on site to our service standards. If something is not right after
  the visit — poor workmanship, incomplete service, or damage related to the partner's work —
  contact Panun Kaergar by phone, WhatsApp, or email with your booking details. Our team will review
  the case, verify the issue where needed, and decide the appropriate next step, which may include
  corrective rework, a refund, or another remedy under our refund policy. You do not have to argue
  with a technician's personal number.
