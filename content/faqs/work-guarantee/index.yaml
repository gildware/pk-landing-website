question: work-guarantee
questionText: Is there a guarantee on the work done?
answer: >-
  Panun Kaergar owns the service experience. Quality standards are set by us, whether the work is
  done by our team or a professional partner. If something is not right after the visit, contact us
  by phone or WhatsApp with your booking details and we will resolve it.
