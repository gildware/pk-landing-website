question: ai-chat-support
questionText: Does Panun Kaergar have in-app chat or other support if I have a question about my booking?
answer: >-
  Yes. The Panun Kaergar customer app includes chat to help you book, check a booking, and get
  quick answers. If you booked by call, WhatsApp, or the website, use the same channels: call
  +91 8899 181 555, WhatsApp us, or send another message with your booking details. For a new
  question that is not already answered here, use the ask-a-question form on this FAQ page.
