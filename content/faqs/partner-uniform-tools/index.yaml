question: partner-uniform-tools
questionText: What tools, equipment, and standards do Panun Kaergar partners need for a job?
answer: >-
  Bring the tools, equipment, and skill for the services you are activated to fulfill. Arrive on
  time, follow Panun Kaergar service standards, treat the home with care, and report problems
  promptly in the Partner app or to our team. Do not collect private payment or leave the customer
  without a way back to Panun Kaergar if something is unfinished.
