questionText: Who comes to my home if I book a service with Panun Kaergar?
answer: >-
  A Panun Kaergar professional suited to the job. You booked the company, not a stranger’s
  personal phone. We assign someone for that work, confirm the visit, and stay responsible for
  pricing, quality, and support. If the visit is not right, you come back to Panun Kaergar — you
  do not have to chase a private number.
