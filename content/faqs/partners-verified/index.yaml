question: partners-verified
questionText: Who comes to my home?
answer: >-
  You booked Panun Kaergar. We assign the job to our own service team or a professional partner
  who works to our requirements. Everyone who takes jobs for us goes through registration and
  checks before they are sent to a customer. You deal with Panun Kaergar for pricing, quality,
  and support.
