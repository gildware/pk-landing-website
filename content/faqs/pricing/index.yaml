question: pricing
questionText: How much do Panun Kaergar home services cost, and do I see the price before work starts?
answer: >-
  Panun Kaergar confirms an estimate or rate before work begins for most jobs. The amount depends
  on the service, the size of the job, your area, and any parts required. In the app you typically
  see an estimate before you confirm. If you book by call, WhatsApp, or the website, our team
  confirms pricing with you. Extra materials or labour should be explained before work continues.
  There is no separate website booking fee.
