questionText: How much do home services cost in Srinagar?
answer: >-
  Panun Kaergar confirms the expected cost before work begins. Prices depend on the service type,
  job size, and parts required. In the app you see estimates before confirming. When you book by
  phone, WhatsApp, or our website form, our team confirms pricing. There are no hidden booking
  fees on the website.
